<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style/estilos.css">
    <title>Economía doméstica</title>
</head>
<body>
    <div class="pagina">
        <main class="contenido-principal">
            <section id="conceptos"></section>

            <footer>
                <textarea name="resumenGastos" id="resumenGastos" cols="20" rows="10"></textarea>
                <button type="button" onclick="finalizarTramite()">Finalizar trámite</button>
            </footer>
        </main>

        <aside id="panelPagos">
            <h2>Pagos realizados</h2>
            <ul id="historialPagos"></ul>
        </aside>
    </div>

    <dialog id="detalleConceptos">
        <h2>Detalle de conceptos pagados</h2>
        <ul id="listaDetalles"></ul>
        <button type="button" id="cerrarDetalle">Cerrar</button>
    </dialog>

    <script src="./scripts/funciones.js"></script>
</body>
</html>
